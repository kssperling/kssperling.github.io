<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Рийо — Meowmulia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise"></div>
    <main class="wish-detail">
      <header class="section-head">
        <div>
          <p class="eyebrow">Вишлист</p>
          <h1>Рийо</h1>
        </div>
        <div class="actions">
          <button id="toggle-mode-riyo" class="ghost">Ночь</button>
          <a class="pill ghost" href="/wishlist.html">Назад к списку</a>
          <a class="pill ghost" href="https://t.me/meowmullia" target="_blank" rel="noreferrer">ТГК</a>
          <a class="pill ghost" href="https://t.me/wiillliix" target="_blank" rel="noreferrer">Личка</a>
        </div>
      </header>

      <section class="gallery-stack">
        <div class="stack-thumb grad model">
          <img
            src="/assets/photo_2026-03-25_10.16.41-ad679724-6fee-4d6b-a67a-c6f66cfb2828.png"
            alt="Рийо — фото 1"
          />
        </div>
        <div class="stack-thumb grad model">
          <img
            src="/assets/photo_2026-03-25_10.16.41-ad679724-6fee-4d6b-a67a-c6f66cfb2828.png"
            alt="Рийо — фото 2"
          />
        </div>
        <div class="stack-thumb grad model">
          <img
            src="/assets/photo_2026-03-25_10.16.41-ad679724-6fee-4d6b-a67a-c6f66cfb2828.png"
            alt="Рийо — фото 3"
          />
        </div>
      </section>

      <section class="detail-meta">
        <div class="detail-block">
          <h3>Описание</h3>
          <p class="microcopy">Гачиакута / Рийо. Сильное текстурирование.</p>
        </div>

        <div class="detail-block">
          <h3>Требования / кастом</h3>
          <ul class="bullet">
            <li>Подбор вариантов по рефам (детали текстуры и окраса уточняются)</li>
          </ul>
        </div>

        <div class="detail-block">
          <h3>Сроки и цена</h3>
          <p class="microcopy">Срок изготовления: до месяца</p>
          <p class="price strong">9 500 ₽</p>
          <a class="pill primary" href="https://t.me/meowmullia" target="_blank" rel="noreferrer"
            >Заказать эту работу</a
          >
        </div>
      </section>
    </main>

    <script>
      const toggleRiyo = document.getElementById('toggle-mode-riyo');
      if (toggleRiyo) {
        toggleRiyo.addEventListener('click', () => {
          const nextMode = document.body.dataset.mode === 'day' ? 'night' : 'day';
          document.body.dataset.mode = nextMode;
          toggleRiyo.textContent = nextMode === 'day' ? 'День' : 'Ночь';
        });
      }
    </script>
  </body>
</html>
